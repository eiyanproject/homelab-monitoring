apiVersion: 1

datasources:
  # VictoriaMetrics speaks PromQL, so Grafana treats it as Prometheus and every
  # community dashboard (1860, 23855, 10347 ...) imports unchanged.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      prometheusType: Prometheus
    editable: false

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
