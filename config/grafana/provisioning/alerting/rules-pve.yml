apiVersion: 1

# Rules against the metric names PVE's InfluxDB push actually produces,
# read off a live PVE 9.2 cluster. Nodes and guests use DIFFERENT measurement
# families - this is the thing that catches people out:
#
#   object=nodes     cpustat_* (cpu is a 0-1 FRACTION), memory_memused/memtotal/
#                    swapused, nics_receive/transmit, blockstat_* (node rootfs),
#                    system_uptime
#   object=lxc       system_cpu, system_mem/maxmem, system_disk/maxdisk,
#                    system_netin/netout, system_diskread/diskwrite,
#                    system_status, system_pressure{cpu,io,memory}{some,full}
#   object=qemu      the same system_* set, plus ballooninfo_* (agent only)
#                    and blockstat_* (virtual block devices)
#   object=storages  system_used / system_total / system_avail
#
# Labels: host (node OR guest OR storage name), vmid, nodename, object.
# `node` is OUR label - which vmagent ingested the sample.
#
# The guest-stopped rule is not here yet: system_status exists, but how its
# value is encoded decides the rule. See docs/PVE-ALERTS.md.

groups:
  - orgId: 1
    name: proxmox-nodes
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-pve-node-cpu
        title: Node CPU saturated
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has been above 90% CPU for 15 minutes"
          runbook: "Find the guest responsible on the Proxmox dashboard's Guest CPU panel. On an overcommitted node this usually means one guest changed behaviour, not that the node is undersized."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'cpustat_cpu{object="nodes"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [90], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-node-load
        title: Node load above core count
        condition: B
        for: 20m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} 15m load is 1.5x its core count"
          runbook: "Work is queueing rather than running. Check I/O wait first - storage contention looks like CPU load but is not."
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'cpustat_avg15{object="nodes"} / cpustat_cpus{object="nodes"}', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1.5], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-node-iowait
        title: Node I/O wait high
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} is spending over 20% of its time waiting on storage"
          runbook: "Usually a backup, a large restore, or a failing disk. Check SMART before assuming it is workload."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            # cpustat_wait, NOT cpustat_iowait. Confirmed on a live cluster:
            # iowait is a cumulative counter (tens of thousands of jiffies and
            # climbing), wait is the instantaneous 0-1 ratio. Using iowait made
            # this rule fire permanently and it would have kept re-notifying
            # every 4h - a false alert that never clears is worse than no rule.
            model: {editorMode: code, expr: 'cpustat_wait{object="nodes"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [20], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-node-memory
        title: Node memory nearly exhausted
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} is above 95% memory"
          runbook: "The OOM killer picks its own victim, and it will not be the one you would choose. Stop or shrink a guest now."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'memory_memused{object="nodes"} / memory_memtotal{object="nodes"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [95], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-node-swap-growth
        title: Node swap use growing
        condition: B
        for: 20m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has swapped a further 100 MB in the last hour"
          runbook: "Deliberately measures GROWTH, not absolute swap. A node sitting on a steady few hundred MB is normal and must not alert every day; swap that keeps climbing is memory pressure getting worse."
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'delta(memory_swapused{object="nodes"}[1h])', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [104857600], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  - orgId: 1
    name: proxmox-guests
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-pve-guest-disk
        title: Guest disk nearly full
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} (vmid {{ $labels.vmid }}) is over 90% disk"
          runbook: "PVE reports this for the guest's own filesystem, so no node_exporter is needed. Inside the guest: du -xh --max-depth=2 / | sort -h | tail -20"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'system_disk{object=~"lxc|qemu"} / system_maxdisk{object=~"lxc|qemu"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [90], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-guest-stopped
        title: Guest stopped unexpectedly
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} (vmid {{ $labels.vmid }}) on {{ $labels.nodename }} has stopped"
          runbook: "Fires only for a guest that was running within the last 2 hours, so anything you deliberately left off never alerts, and a deliberate shutdown self-clears after 2h. If a guest stopped on its own, check the node's memory - the OOM killer picks its own victim. NOTE: system_status is useless here; PVE sends it as a string, which VictoriaMetrics stores as a constant 0 for running and stopped guests alike. system_uptime is the real signal."
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              # Was up within 2h, is not up now. Written this way round so the
              # result carries a positive value (the previous uptime) - the
              # obvious `system_uptime == 0 and ...` returns 0, which no
              # greater-than threshold can ever match.
              expr: 'max_over_time(system_uptime{object=~"lxc|qemu"}[2h]) > 0 unless system_uptime{object=~"lxc|qemu"} > 0'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-guest-disk-trend
        title: Guest disk will be full within 4 days
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} (vmid {{ $labels.vmid }}) is projected to fill within 4 days"
          runbook: "Projected from the last 6h of growth. This is the alert that gives you a weekend instead of a 3am one - act on it while it is still a warning."
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'predict_linear(system_disk{object=~"lxc|qemu"}[6h], 4*86400) > system_maxdisk{object=~"lxc|qemu"}'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-guest-memory
        title: Guest memory nearly exhausted
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} (vmid {{ $labels.vmid }}) is above 95% of its memory limit"
          runbook: "Raise the guest's memory in Proxmox, or find what grew inside it. For LXC this is a hard cgroup limit - the guest gets OOM-killed, the node does not."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'system_mem{object=~"lxc|qemu"} / system_maxmem{object=~"lxc|qemu"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [95], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-guest-io-pressure
        title: Guest stalled on I/O
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} (vmid {{ $labels.vmid }}) is stalled waiting on I/O"
          runbook: "PSI measures time tasks spent BLOCKED, which rises before any utilisation graph saturates. Often the earliest sign a disk is going."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'system_pressureiosome{object=~"lxc|qemu"}', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [30], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  - orgId: 1
    name: proxmox-storage
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-pve-old-snapshot
        title: Forgotten snapshot
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "Snapshot '{{ $labels.snapshot }}' on {{ $labels.guest }} (vmid {{ $labels.vmid }}) is over 14 days old"
          runbook: "Snapshots grow as blocks diverge from the snapshot point, and on thin-LVM a full pool takes guests read-only. Delete it once you no longer need the rollback:  pct delsnapshot <vmid> <name>   (or qm delsnapshot for a VM). Needs scripts/report-snapshots.sh in cron on each node."
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'pve_snapshot_age_seconds > 14 * 86400'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-storage-full
        title: Storage nearly full
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "Storage {{ $labels.host }} on {{ $labels.nodename }} is over 90% used"
          runbook: "thin-LVM does not fail gracefully when it fills - guests go read-only. Free space before it gets there."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'system_used{object="storages"} / system_total{object="storages"} * 100', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [90], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # A node whose PVE push stops. The survivor's store holds a full copy of every
  # metric, so whichever node evaluates alerts sees the other one go quiet.
  # When the evaluating node itself dies, only the OCI watchdog can say so.
  # Written the backwards way, like guest-stopped: `unless` returns the last
  # uptime, which is positive, so a gt-0 threshold can match it. [1d] keeps it
  # firing for a day instead of self-clearing after 2 h like the guest rule.
  - orgId: 1
    name: proxmox-reachability
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-pve-node-silent
        title: Proxmox node stopped reporting
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "Proxmox node {{ $labels.host }} has sent no metrics for 5 minutes"
          runbook: "The node is down or rebooting, or its metric-server push broke (pvesh get /cluster/metrics/server). If it is up: systemctl status pvestatd there. If it is down: the survivor /etc/pve is read-only until pvecm expected 1."
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'max_over_time(system_uptime{object="nodes"}[1d]) unless system_uptime{object="nodes"}', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-pve-node-rebooted
        title: Proxmox node rebooted
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "Proxmox node {{ $labels.host }} booted {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} ago"
          runbook: "If nobody rebooted it: journalctl -b -1 -n 200 on the node for the reason. The node that boots from the USB SSD whose link resets shows up here first. Self-clears 30 min after boot."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'system_uptime{object="nodes"} < 1800', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # The numbers setup-backups.sh and report-snapshots.sh push. Both are pushed,
  # not scraped (twice a day / hourly), hence last_over_time. The two
  # "not reporting" rules compare against the node count, so they also fire
  # when the metric has never existed - the state on 2026-11-27.
  - orgId: 1
    name: backups
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-backup-stale
        title: Backup is over 2 days old
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "Newest backup on {{ $labels.node }} is {{ with $values.A }}{{ humanize .Value }}{{ end }} hours old"
          runbook: "cat /etc/pve/jobs.cfg for the vzdump job, and journalctl -t hm-backup-mirror on that node. 48 h is the threshold setup-backups.sh prints (172800 s)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'max by (node) (last_over_time(backup_age_seconds[14h])) / 3600', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [48], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-backup-none
        title: No backup files found
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "hm-backup-mirror on {{ $labels.node }} found no dump files at all"
          runbook: "The mirror reports -1 when the dump dir is empty: the vzdump job is missing, disabled or writing to another storage. Check /etc/pve/jobs.cfg."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'min by (node) (last_over_time(backup_age_seconds[14h]))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-backup-mirror-failed
        title: Backup mirror to the peer failed
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "The last backup mirror run on {{ $labels.node }} failed"
          runbook: "rsync to the peer exited non-zero. Run /usr/local/bin/hm-backup-mirror by hand on that node. Usual causes: the peer is down, or its root ssh key is not accepted (ssh -o BatchMode=yes root@<peer> true)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: '1 - min by (node) (last_over_time(backup_mirror_ok[14h]))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-backup-not-reporting
        title: Backup freshness is not being reported
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ with $values.A }}{{ .Value }}{{ end }} Proxmox node(s) sent no backup_age_seconds in 26 hours"
          runbook: "crontab -l on each node for hm-backup-mirror; if it is missing, run scripts/setup-backups.sh. Without this rule a backup that stopped months ago is silent."
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'count(system_uptime{object="nodes"}) - (count(count by (node) (last_over_time(backup_age_seconds[26h]))) or vector(0))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-snapshot-report-not-running
        title: Snapshot report is not running
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ with $values.A }}{{ .Value }}{{ end }} Proxmox node(s) sent no pve_snapshot_count in 3 hours"
          runbook: "pve_snapshot_count is sent even at zero, so its absence means the hourly cron is not running. crontab -l on each node, then reinstall the line at the top of scripts/report-snapshots.sh. Forgotten snapshot is blind until this clears."
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'count(system_uptime{object="nodes"}) - (count(count by (nodename) (last_over_time(pve_snapshot_count[3h]))) or vector(0))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
