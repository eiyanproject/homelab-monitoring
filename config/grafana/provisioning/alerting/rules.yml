apiVersion: 1

# Every rule carries a `runbook` annotation. If you cannot write one, the thing
# is a dashboard panel, not an alert.
#
# Rules 4-6 depend on node_exporter and stay silent until you have rolled it
# out. That is intentional - they cost nothing while the metric is absent.
# PVE guest-state rules are NOT here: add them from docs/PVE-ALERTS.md once you
# have confirmed what metric names your OTLP push actually emits.

groups:
  - orgId: 1
    name: stack
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-stack-down
        title: Monitoring component down
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has stopped responding"
          runbook: "On the mon LXC: docker compose ps, then docker compose logs --tail=100 <service>"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'up{component="monitoring"} == 0'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-replication-backlog
        title: Replication backlog to peer node
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "vmagent on {{ $labels.node }} is queueing data for its peer"
          runbook: "The other node is down or unreachable. Data is safe on disk and replays automatically. If BUFFER_MAX is reached, the oldest queued data is dropped - fix the peer before that."
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'sum(vmagent_remotewrite_pending_data_bytes) by (node)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [536870912], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-ingestion-stalled
        title: Metric ingestion stalled
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "No metrics have been written on {{ $labels.node }} for 10 minutes"
          runbook: "Check vmagent logs first - a scrape config error stops everything silently. Then confirm VictoriaMetrics is accepting writes on :8428."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'sum(rate(vm_rows_inserted_total[5m]))'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  - orgId: 1
    name: guests
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-fs-filling
        title: Filesystem will be full within 4 days
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is filling up"
          runbook: "Projected from the last 6h of usage. Usually logs or an unrotated download dir. Check with: du -xh --max-depth=2 <mountpoint> | sort -h | tail -20"
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 4*24*3600) < 0'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [-1e12], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-fs-critical
        title: Filesystem under 10 percent free
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is nearly full"
          runbook: "Databases corrupt at 0 percent, not at 90. Free space now, then find out what grew."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: '(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [10], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-sustained-swap
        title: Sustained swapping
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has been swapping for 15 minutes"
          runbook: "The guest needs more RAM, or the node is overcommitted. Node 1 runs ~2.6x overcommitted by design - confirm this is the guest and not just the host reclaiming."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m])'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [10], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # learnbox (CT 116 on eiyan2). The first two are the service contract; the
  # last two are specific to what this service is - a box that runs arbitrary
  # learner code as a real shell, where the guards being OFF is the incident.
  - orgId: 1
    name: learnbox
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-learnbox-down
        title: learnbox is not responding
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "learnbox has stopped answering its scrape"
          runbook: "pct exec 116 -- systemctl status learnbox, then journalctl -u learnbox -n 100. Both mon LXCs scrape this target, so max without(node) means one node's vmagent being down does not fire this."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'max without(node) (up{service="learnbox"})'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-learnbox-errors
        title: learnbox is returning 5xx
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 5 percent of learnbox requests are failing"
          runbook: "Check learnbox_errors_total by kind on the dashboard first - it says which subsystem. A 4xx floor is normal here (the CSRF header guard) and is deliberately not part of this ratio."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'sum(max without(node) (rate(learnbox_requests_total{status=~"5.."}[10m]))) / sum(max without(node) (rate(learnbox_requests_total[10m]))) * 100'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-learnbox-workspace-full
        title: learnbox workspace is running out of space
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The learner filesystem is under 1 GiB free"
          runbook: "Fires above the service's own floor: below LEARNBOX_MIN_FREE_MB (512 MB) readyz goes unavailable and new shells and checks are refused. Usually a cargo target dir or a .venv - pct exec 116 -- du -xh --max-depth=2 /home/learner | sort -h | tail -20"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'max without(node) (learnbox_workspace_free_bytes)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1073741824], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-learnbox-cpu-uncapped
        title: learnbox CPU cap is not in force
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The learner cgroup is running without cpu.max"
          runbook: "Learner code runs as a real shell, so an uncapped box is one runaway loop away from starving the node. Check cgroup v2 delegation: pct exec 116 -- cat /sys/fs/cgroup/learnbox/learner/cpu.max should not be 'max 100000'. A container restart without Delegate=yes is the usual cause."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'max without(node) (learnbox_cpu_capped)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # catalog (CT 113 on eiyan2, catalog-api on :9101). Down and 5xx are the
  # service contract. The two stale rules are this service's jobs: the weekly
  # dump update, and the daily pull backup of the local edits. The PVE guest
  # rules already cover CT 113 stopping or its disk filling.
  - orgId: 1
    name: catalog
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-catalog-down
        title: catalog is not responding
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "catalog-api has stopped answering its scrape"
          runbook: "pct exec 113 -- docker compose -f /opt/catalog/catalog-api/deploy/docker-compose.yml ps, then docker logs --tail=100 catalog-api. All three containers are restart: unless-stopped, so a crash loop shows as Restarting. Both mon LXCs scrape it; max without(node) keeps one vmagent being down from firing this."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: 'max without(node) (up{service="catalog-api"})'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-catalog-errors
        title: catalog is returning 5xx
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 5 percent of catalog requests are failing"
          runbook: "catalog_errors_total by kind on the hm-catalog dashboard says which subsystem. 'database' during a Tuesday update usually means pool starvation (HANDOVER section 5). Needs 20+ requests in 10 minutes, so one failed page load on an idle evening does not fire it. status is a class label here (5xx), not a code."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: '(sum(max without(node) (rate(catalog_requests_total{status="5xx"}[10m]))) / sum(max without(node) (rate(catalog_requests_total[10m]))) * 100) and on() (sum(max without(node) (increase(catalog_requests_total[10m]))) > 20)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-catalog-update-stale
        title: catalog weekly update has not succeeded
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "No successful dump update for over 8 days"
          runbook: "GET http://192.168.0.14/api/v1/status shows the last run's error. Common causes: r18.dev refusing the download (403/UA) or the free-space preflight. Fallback: upload the dump on Admin -> Update DB. Only fires where UPDATE_ENABLED=true (catalog_update_enabled == 1); a timestamp of 0 means no success was ever recorded."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: '((time() - max without(node) (catalog_update_last_success_timestamp_seconds)) / 86400) and on() (max without(node) (catalog_update_enabled) == 1)'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [8], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-catalog-backup-stale
        title: catalog backup has not run
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "No successful backup of the catalog's local edits for over 36 hours"
          runbook: "On the backup host: systemctl status catalog-backup.timer, journalctl -u catalog-backup -n 50. The script exits non-zero when the login fails (ADMIN_PASSWORD in /etc/catalog-backup.env out of step with the catalog's admin password, changed under Settings -> Account) or the response is not an export. The metric is pushed once a day, hence last_over_time; silent until the first backup has ever run."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: '(time() - max(last_over_time(catalog_backup_last_success_timestamp_seconds{service="catalog-api"}[30d]))) / 3600'
              instant: true
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [36], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # Alerting watching itself. The Traps all share one shape - it provisioned
  # and did nothing - and these catch the ways that has happened here:
  # notifications failing (85 of 85 on 2026-11-27), both nodes evaluating, and
  # a scrape target that can never be up. A delivery failure can only reach you
  # through some OTHER channel that works - one more reason to configure two.
  # The OCI watchdog checks delivery as well, over its own path.
  - orgId: 1
    name: alerting-health
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-alert-delivery-failing
        title: Alert notifications are failing
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.integration }} notifications are failing"
          runbook: "Grafana -> Alerting -> Contact points shows the last error per integration. Then on the mon LXC: sh scripts/test-alert.sh /srv/monitoring - it posts through the same URL and token as Grafana, from inside the Grafana container, and prints the HTTP status. 401/403 is NTFY_TOKEN; a resolve or connect error is NTFY_URL, DNS or the OCI tunnel."
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'sum by (node, integration) (increase(grafana_alerting_notifications_failed_total[30m]))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-alerting-on-both-nodes
        title: Alert rules are evaluated on both nodes
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "More than one Grafana is evaluating alert rules - every alert will arrive twice"
          runbook: "On the standby, set ALERTING_DIR=./config/grafana/provisioning/alerting-disabled in /srv/monitoring/.env, then docker compose up -d. Rule groups already in its Grafana DB stay until deleted under Alerting -> Alert rules: provisioning never removes a group that left the files."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'count(count by (node) (grafana_alerting_rule_group_rules{type="alerting"}))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-replication-dropping
        title: Replication is dropping samples
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "vmagent on {{ $labels.node }} dropped samples instead of delivering them"
          runbook: "Usually BUFFER_MAX was reached while the peer was down, so the oldest queued data was discarded and the two stores now differ for that window. If it repeats with the peer up: docker compose logs --tail=200 vmagent."
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'sum by (node) (increase(vmagent_remotewrite_samples_dropped_total[30m]))', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

      - uid: hm-scrape-target-down
        title: Exporter target is down
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.guest }} ({{ $labels.instance }}) is listed as a node_exporter target and does not answer"
          runbook: "gen-targets.sh lists every running guest whether or not it runs node_exporter. Install it in the guest, or drop the guest from targets/guests.json. Both mon LXCs scrape it, hence max without(node)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'max without(node) (up{job="node"})', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query

  # Jellyfin (CT 100 on eiyan). Its /metrics has no playback figures, so only
  # the contract's liveness rule applies; the PVE guest rules cover its disk.
  - orgId: 1
    name: jellyfin
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: hm-jellyfin-down
        title: jellyfin is not responding
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: {severity: critical}
        annotations:
          summary: "jellyfin has stopped answering its scrape"
          runbook: "pct exec 100 -- systemctl status jellyfin, then journalctl -u jellyfin -n 100. Both mon LXCs scrape this target, so one node vmagent being down does not fire this."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {editorMode: code, expr: 'max without(node) (up{service="jellyfin"})', instant: true, range: false, refId: A}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
