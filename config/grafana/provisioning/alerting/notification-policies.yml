apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: [alertname, node, guest]
    routes:
      # Wake me up.
      - receiver: critical-all
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      # Look at it this week.
      - receiver: discord
        object_matchers:
          - ["severity", "=", "warning"]
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
