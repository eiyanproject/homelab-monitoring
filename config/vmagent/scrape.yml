global:
  # Applied to SCRAPED metrics ONLY. Verified against a live vmagent: data
  # pushed in through the influx endpoint does not receive these labels.
  #
  # That distinction is the entire point. `node` says which vmagent ingested a
  # sample, which is what tells the two stacks apart in their own self-metrics.
  # But PVE pushes to BOTH agents, and each agent replicates to BOTH stores, so
  # if PVE data carried `node` the same sample would land as two series that
  # never collapse - everything doubled in Grafana.
  #
  # -remoteWrite.label cannot be used for this: it is applied AFTER relabeling,
  # so not even an unconditional labeldrop can remove it from pushed data.
  external_labels:
    node: __NODE_NAME__

  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # The stack watching itself. This is what tells you replication is healthy.
  - job_name: stack
    static_configs:
      - targets:
          - vmagent:8429
          - victoriametrics:8428
          - victorialogs:9428
        labels:
          component: monitoring

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
        labels:
          component: monitoring

  # Guests, generated by scripts/gen-targets.sh on the Proxmox host and pushed
  # into this container. Only RUNNING guests are listed - a stopped guest is
  # not a failing target, and guest-down detection comes from the PVE metrics
  # instead. Missing file is fine; vmagent warns once and carries on.
  # NOTE: vmagent has no per-config refresh_interval (that is a Prometheus
  # field). The reload interval is global: -promscrape.fileSDCheckInterval.
  - job_name: node
    file_sd_configs:
      - files: [/etc/vmagent/targets/guests.json]

  # Your own services. See docs/SERVICE-CONTRACT.md.
  - job_name: service
    file_sd_configs:
      - files: [/etc/vmagent/targets/services.json]
